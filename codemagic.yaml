workflows:
  ios-simulator-only:
    name: iOS 仅生成Appetize模拟器包（无需证书）
    instance_type: mac_mini_m1
    max_build_duration: 30
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: 安装Flutter依赖
        script: flutter pub get
      - name: 安装CocoaPods
        script: cd ios && pod install && cd ..
      # 只构建模拟器包，跳过需要签名的IPA
      - name: 构建Appetize模拟器包并导出
        script: |
          # 模拟器构建无需代码签名，直接编译
          flutter build ios --simulator --debug -t lib/main.dart --no-code-sign
          cd build/ios/Debug-iphonesimulator
          zip -r Runner.app.zip Runner.app
          mv Runner.app.zip $CM_EXPORT_DIR/
    artifacts:
      - $CM_EXPORT_DIR/Runner.app.zip
