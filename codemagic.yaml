workflows:
  ios-dual-build:
    name: iOS 双产物构建（上架IPA + Appetize模拟器包）
    instance_type: mac_mini_m1
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: 安装Flutter依赖
        script: flutter pub get
      - name: 安装CocoaPods
        script: cd ios && pod install && cd ..
      # 构建上架用IPA，使用真实的入口文件 lib/main.dart
      - name: 构建上架IPA
        script: flutter build ipa --release -t lib/main.dart
      # 构建Appetize用模拟器包
      - name: 构建模拟器包并导出
        script: |
          flutter build ios --simulator --debug -t lib/main.dart
          cd build/ios/Debug-iphonesimulator
          zip -r Runner.app.zip Runner.app
          mv Runner.app.zip $CM_EXPORT_DIR/
    artifacts:
      - build/ios/ipa/*.ipa
      - $CM_EXPORT_DIR/Runner.app.zip
